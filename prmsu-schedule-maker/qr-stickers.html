<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PRMSU Schedule Maker · QR sticker sheet (A4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @page{size:A4;margin:0}
  body{font-family:'Inter',sans-serif;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media print{ html,body{width:210mm;height:297mm;overflow:hidden} }
  @media screen{
    body{background:#e6e8ee;min-height:100vh;padding:22px 0}
    .sheet{margin:0 auto;box-shadow:0 16px 48px rgba(16,36,59,.26);border-radius:2mm}
  }

  /* minmax(0,1fr) locks the rows to an equal share so they can NOT grow past
     the page (that was clipping the bottom row). */
  .sheet{width:210mm;height:296mm;padding:9mm;display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:0;
    border-top:1px dashed #BBC4D4;border-left:1px dashed #BBC4D4}
  .cell{border-right:1px dashed #BBC4D4;border-bottom:1px dashed #BBC4D4;
    padding:4mm;display:flex;min-height:0}

  .sticker{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    border-radius:4.5mm;background:#fff;box-shadow:0 0 0 1px #E7ECF4;color:#12224a}

  /* ---- blue header ---- */
  /* SOLID blue on purpose: gradients get exported as PDF "shadings" that some
     viewers/printers render wrong (pink). A flat color renders identically. */
  .s-head{position:relative;overflow:hidden;color:#fff;padding:2.8mm 3.8mm 3mm;
    background:#123f9e}
  .s-grid{position:absolute;inset:0;opacity:.14;
    background-image:repeating-linear-gradient(90deg,transparent 0 5mm,rgba(255,255,255,.7) 5mm,rgba(255,255,255,.7) calc(5mm + .3mm)),
      repeating-linear-gradient(0deg,transparent 0 2.4mm,rgba(255,255,255,.55) 2.4mm,rgba(255,255,255,.55) calc(2.4mm + .3mm));
    -webkit-mask-image:linear-gradient(100deg,transparent 42%,#000 96%);mask-image:linear-gradient(100deg,transparent 42%,#000 96%)}
  .s-brandrow{position:relative;display:flex;align-items:center;gap:2mm}
  .s-brandrow img{width:6mm;height:6mm;border-radius:50%;background:#fff;padding:.5mm;flex:0 0 auto}
  .s-brandrow b{font-size:2.4mm;font-weight:800;letter-spacing:.15em}
  .s-brandrow small{display:block;font-size:1.8mm;font-weight:500;color:#BFD0F0;letter-spacing:.02em;margin-top:.2mm}
  .s-hook{position:relative;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:5.6mm;line-height:1.03;letter-spacing:-.02em;margin-top:1.8mm}
  .s-hook em{font-style:normal;color:#F5B82E}

  /* ---- white body with the QR ---- */
  .s-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2.4mm 3.8mm 1.8mm;text-align:center}
  .s-scan{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:3.1mm;color:#12224a;margin-bottom:1.6mm}
  .s-scan span{color:#D99B1C}
  /* white panel + quiet zone so the QR is not "cut" and scans well */
  .s-qr{position:relative;width:37mm;height:37mm;background:#fff;border-radius:2.4mm;padding:3.4mm;
    box-shadow:0 0 0 1px #E7ECF4;flex:0 0 auto}
  .s-qr svg{width:100%;height:100%;display:block}
  .s-qseal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:6mm;height:6mm;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1mm #fff}
  .s-qseal img{width:4.9mm;height:4.9mm}
  .s-desc{font-size:2.2mm;line-height:1.3;color:#5C6B82;margin-top:1.6mm;max-width:62mm}

  /* ---- url footer ---- */
  .s-url{display:flex;align-items:center;justify-content:center;gap:2mm;
    background:#13337C;color:#fff;padding:2mm;font-weight:800;font-size:2.7mm;letter-spacing:.01em}
  .s-url .dot{width:1.3mm;height:1.3mm;border-radius:50%;background:#F5B82E;flex:0 0 auto}
  .s-url .tag{font-weight:600;font-size:2.1mm;color:#BFD0F0;letter-spacing:.02em}

  .hint{position:fixed;bottom:2.5mm;left:0;right:0;text-align:center;font-size:2.6mm;color:#9AA7BC}
  @media print{.hint{display:none}}
</style>
</head>
<body>

  <div class="sheet" id="sheet"></div>
  <div class="hint">A4 · 6 stickers · cut along the dashed lines. Print at 100% scale (no "fit to page").</div>

  <template id="tpl">
    <div class="cell"><div class="sticker">
      <div class="s-head">
        <div class="s-grid"></div>
        <div class="s-brandrow"><img src="seal.png" alt=""><b>PRMSU SCHEDULE MAKER<small>Unofficial · student-made</small></b></div>
        <div class="s-hook">Class schedule<br>a <em>mess</em>?</div>
      </div>
      <div class="s-body">
        <div class="s-scan">Scan it <span>&#128071;</span> and sort it out.</div>
        <div class="s-qr"><svg viewBox="0 0 33 33"><use href="#qr"/></svg><span class="s-qseal"><img src="seal.png" alt=""></span></div>
        <div class="s-desc">Upload your COR, get a clean weekly schedule. Free, no sign-up.</div>
      </div>
      <div class="s-url"><span class="dot"></span>prmsu-sched.netlify.app<span class="tag">· Free</span></div>
    </div></div>
  </template>

  <script>
    var sheet=document.getElementById('sheet'), tpl=document.getElementById('tpl');
    for(var i=0;i<6;i++) sheet.appendChild(tpl.content.cloneNode(true));
  </script>
</body>
</html>
